<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>聴衆画面 - 発表支援AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="screen active">
    <div class="audience-shell">
      <div class="topbar">
        <div>
          <div class="brand">聴衆画面</div>
          <div class="muted" style="font-size:13px">授業コード：SLIDE-QA</div>
        </div>
        <a class="btn secondary small" href="index.html">ログアウト</a>
      </div>

      <div class="audience-status">
        <h2>現在発表中です</h2>
        <p class="muted">発表内容について、気になったことを自由に質問できます。</p>

        <div class="current-slide slide-viewer" id="audience-slide-view">
          <div>
            <div class="slide-tag">Slide Q&A AI</div>
            <div style="font-size:28px;font-weight:900;margin-top:10px">スライド未アップロード</div>
            <p style="color:#dbeafe;margin-top:12px">発表者がスライドをアップロードするとここに表示されます。</p>
          </div>
        </div>

        <div class="question reverse-audience-card" id="audience-reverse-question-area" style="display:none;border-color:#ddd6fe;background:#faf5ff"></div>

        <div class="question" style="border-color:#cbd5e1;background:#fff">
          <span class="tag purple">自由質問</span>
          <div class="question-title" style="font-size:19px">発表内容について質問する</div>
          <textarea id="question-input" rows="4" maxlength="500" placeholder="例：なぜこの手法を選んだのですか？"></textarea>
          <div style="font-size:12px;color:#94a3b8;text-align:right;margin-top:4px"><span id="char-count">0</span> / 500文字</div>
          <button class="btn" id="send-btn" type="button" style="width:100%;margin-top:12px" onclick="submitQuestion()">質問を送信</button>
          <div class="success-toast" id="success-toast">質問を送信しました。発表者画面に反映されます。</div>
          <div id="error-msg" style="display:none;color:#dc2626;font-size:13px;margin-top:10px;text-align:center"></div>
        </div>

        <div class="qa-item auto-answer-card" id="auto-answer-card" style="display:none;margin-top:14px">
          <span class="tag green">Q&A CSVから自動回答</span>
          <h3 style="margin-top:10px">過去の質問からの自動回答</h3>
          <p class="auto-answer-content" id="auto-answer-content"></p>
          <p class="auto-answer-matched" id="auto-answer-matched"></p>
        </div>

        <div class="question" id="sent-list-card" style="display:none;border-color:#bbf7d0;background:#f0fdf4">
          <span class="tag green">送信履歴</span>
          <div class="question-title" style="font-size:18px">この端末から送った質問</div>
          <ul class="question-list" id="sent-list"></ul>
          <button class="btn secondary small" type="button" onclick="clearSentList()">リストをクリア</button>
        </div>
      </div>
    </div>
  </section>

  <div id="toast" class="toast"></div>
  <script src="script.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      initAudiencePage();
    });
  </script>
</body>
</html>
