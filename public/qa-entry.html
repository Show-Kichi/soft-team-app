<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>質問整理AI - 発表支援AIアプリ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="page-header">
      <div class="container">
        <a href="index.html" class="app-name">🎤 発表支援AI</a>
        <span class="page-title">質問整理AI</span>
      </div>
    </header>

    <main class="main-content">
      <div class="container">

        <div style="text-align: center; padding: 32px 20px 24px;">
          <span style="font-size: 48px;">🗂️</span>
          <h1 style="font-size: 24px; font-weight: 800; color: #1a1a2e; margin: 12px 0 8px;">質問整理AI</h1>
          <p style="font-size: 14px; color: #64748b;">あなたはどちらですか？</p>
        </div>

        <div class="role-grid">
          <!-- 発表者 -->
          <a href="presenter.html" class="role-card">
            <span class="role-card-icon">👨‍🏫</span>
            <div class="role-card-title">発表者ページ</div>
            <div class="role-card-desc">
              聴衆用QRコードの表示、<br />
              質問一覧の確認、AI整理結果を見る
            </div>
          </a>

          <!-- 聴衆 -->
          <a href="audience.html" class="role-card">
            <span class="role-card-icon">👥</span>
            <div class="role-card-title">聴衆ページ</div>
            <div class="role-card-desc">
              発表者への質問を<br />
              入力・送信する
            </div>
          </a>
        </div>

        <div style="text-align: center; margin-top: 24px;">
          <a href="index.html" class="back-link">← トップに戻る</a>
        </div>

      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
