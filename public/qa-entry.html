<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>プロジェクト管理 - 発表支援AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="screen active">
    <div class="app">
      <div class="topbar">
        <div>
          <div class="brand">プロジェクト管理</div>
          <div class="muted" style="font-size:13px">発表資料・聴衆URL・Q&A CSVを管理します。</div>
        </div>
        <div class="topbar-actions">
          <a class="btn secondary small" href="index.html">ログアウト</a>
        </div>
      </div>

      <div class="project-grid">
        <a class="project-card" href="presenter.html">
          <h2>質問整理AI デモ</h2>
          <p class="muted">聴衆からの質問を集め、AIで整理する発表用プロジェクト</p>
          <div class="project-meta">
            <span class="tag blue">授業コード SLIDE-QA</span>
            <span class="tag green">質問受付中</span>
            <span class="tag orange">Q&A CSV対応</span>
          </div>
          <span class="btn" style="width:100%">発表者画面を開く</span>
        </a>

        <a class="project-card" href="audience.html">
          <h2>聴衆として参加</h2>
          <p class="muted">スマホや別タブから質問を入力・送信します。</p>
          <div class="project-meta">
            <span class="tag purple">自由質問</span>
            <span class="tag green">自動回答対応</span>
          </div>
          <span class="btn secondary" style="width:100%">聴衆ページを開く</span>
        </a>

        <div class="project-card" style="cursor:default">
          <h2>新規プロジェクト</h2>
          <p class="muted">将来的に、発表ごとに資料・授業コード・Q&A CSVを分けて管理できます。</p>
          <div class="project-meta">
            <span class="tag">今後実装予定</span>
          </div>
          <button class="btn secondary" style="width:100%" disabled>作成</button>
        </div>
      </div>
    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
