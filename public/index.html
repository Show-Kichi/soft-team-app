<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>発表支援AIアプリ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="screen active">
    <div class="login-wrap">
      <div class="login-card">
        <div class="logo">AI</div>
        <h1>発表支援AI</h1>
        <p class="muted" id="loginHelp">発表者はプロジェクト管理へ、聴衆は質問送信ページへ進みます。</p>

        <label>ログイン種別</label>
        <div class="role-row">
          <button id="presenterRole" class="role-btn active" type="button" onclick="selectRole('presenter')">発表者</button>
          <button id="audienceRole" class="role-btn" type="button" onclick="selectRole('audience')">聴衆</button>
        </div>

        <div id="presenterLoginFields">
          <label>メールアドレス</label>
          <input value="teacher@example.com" aria-label="メールアドレス" />
          <label>パスワード</label>
          <input type="password" value="password" aria-label="パスワード" />
        </div>

        <div id="audienceLoginFields" style="display:none">
          <label>授業コード</label>
          <input value="SLIDE-QA" aria-label="授業コード" />
          <label>パスワード</label>
          <input type="password" value="1234" aria-label="パスワード" />
        </div>

        <button class="btn" style="width:100%;margin-top:18px" type="button" onclick="loginFromHome()">ログイン</button>

        <div style="margin-top:16px;font-size:12px;line-height:1.7" class="muted">
          ※ デモ版のため、入力内容の認証は行いません。現状アプリの質問送信・質問一覧・CSVアップロード・AI整理機能をそのまま使います。
        </div>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
